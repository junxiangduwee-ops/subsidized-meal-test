openapi: 3.0.3
info:
  title: MR DIY Subsidized Meal System API
  description: |
    REST API for the MR DIY Subsidized Meal ordering system.

    ## Authentication
    Most endpoints require an active session cookie (`session` HttpOnly cookie set after login).
    Two SSO flows are supported: **Joget Identify** (unsigned, parameter-based) and **OIDC** (PKCE, standard OAuth2 flow).

    ## Money
    All monetary values are stored and returned in **sen** (integer). 1 MYR = 100 sen.
    Display formatting is handled client-side via `lib/money.ts`.

    ## Roles
    | Role | Key permissions |
    |------|----------------|
    | `ADMIN` | Full access |
    | `FINANCE` | Finance exports, payment views |
    | `ANALYTICS` | Analytics access |
    | `RECEPTION` | Delivery/reception view |
    | `USER` | Own orders, menu ordering |

    > **⚠️ AI-generated content notice:** This spec was generated from source code analysis.
    > Review all endpoints, request/response shapes, and descriptions before using in production or publishing externally.
  version: 1.0.0
  contact:
    email: ai.automation@mrdiy.com

servers:
  - url: https://subsidized-meal-test.vercel.app
    description: Production (Vercel)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth – Joget
    description: Joget SSO identification (unsigned, iframe-friendly)
  - name: Auth – OIDC
    description: Standard OpenID Connect / OAuth2 PKCE flow
  - name: Exports
    description: CSV data exports (Finance, Kitchen, catalogue, personal)
  - name: Orders
    description: Order status polling
  - name: Webhooks
    description: Inbound payment gateway webhooks (HitPay)

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:

  # ── Auth: Joget identify ─────────────────────────────────────────────────
  /api/auth/joget-identify:
    get:
      tags: [Auth – Joget]
      operationId: jogetIdentify
      summary: Log in as the currently-active Joget user
      description: |
        Accepts Joget hash-variable substitution parameters, destroys any
        existing session, provisions or syncs the user account, and redirects
        to the user's landing page.

        **Security note:** This endpoint carries no cryptographic signature.
        It relies on network-level trust (intranet / Joget iframe origin).
        Revisit once a Joget server-to-server API key is available.

        A request with **neither** `email` nor `staffId` always redirects to
        `/embed/error?reason=sso_failed`.

        All redirects set `Cache-Control: no-store` so no browser or CDN
        cache can serve a stale response for a different user.
      parameters:
        - name: username
          in: query
          description: "`#currentUser.username#` – used as `externalId` when staffId/email are absent"
          schema:
            type: string
            example: jsmith
        - name: email
          in: query
          description: "`#currentUser.email#` – lowercased; optional if staffId is present"
          schema:
            type: string
            format: email
            example: john.smith@mrdiy.com
        - name: name
          in: query
          description: "`#currentUser.firstName# #currentUser.lastName#`"
          schema:
            type: string
            example: John Smith
        - name: staffId
          in: query
          description: "`#currentUser.employee.code#` – preferred identifier; required when email is absent"
          schema:
            type: string
            example: E001234
        - name: department
          in: query
          description: Department name from Joget
          schema:
            type: string
            example: IT
        - name: groups
          in: query
          description: |
            Semicolon-separated Joget group names (`#currentUser.groups.name#`).
            Used to derive the user role. Recognised values that map to elevated
            roles are configured in `lib/rbac.ts`; anything else defaults to `USER`.
          schema:
            type: string
            example: "Admin;Finance"
      responses:
        '302':
          description: |
            Redirect to landing page on success, or to an error page on failure.

            | Redirect destination | Condition |
            |---|---|
            | `/{role-landing}` | Successful login |
            | `/embed/error?reason=sso_failed` | Both email and staffId are blank |
            | `/embed/error?reason=inactive` | Account exists but is inactive, or provisioning threw |
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache, must-revalidate, max-age=0
            Set-Cookie:
              description: Sets the `session` HttpOnly cookie
              schema:
                type: string

  # ── Auth: OIDC start ─────────────────────────────────────────────────────
  /api/auth/oidc/start:
    get:
      tags: [Auth – OIDC]
      operationId: oidcStart
      summary: Begin the OIDC / OAuth2 PKCE login flow
      description: |
        Generates a PKCE `code_verifier` + `code_challenge`, stores them in
        short-lived (10 min) HttpOnly cookies (`oidc_state`, `oidc_verifier`),
        and redirects the browser to the Identity Provider's authorisation URL.

        Disabled when the `OIDC_*` environment variables are not configured
        (`oidcEnabled()` returns false).
      responses:
        '302':
          description: |
            | Redirect destination | Condition |
            |---|---|
            | IdP authorisation URL | OIDC is configured |
            | `/login?error=sso_disabled` | OIDC env vars are not set |
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Sets `oidc_state` and `oidc_verifier` HttpOnly cookies (maxAge 600 s)
              schema:
                type: string

  # ── Auth: OIDC callback ───────────────────────────────────────────────────
  /api/auth/oidc/callback:
    get:
      tags: [Auth – OIDC]
      operationId: oidcCallback
      summary: Handle the IdP redirect and complete login
      description: |
        Called by the Identity Provider after the user authenticates.
        Validates the `state` cookie, exchanges the `code` for tokens,
        provisions or syncs the user, creates a session, and redirects.

        State and verifier cookies are deleted (one-shot) before any other
        processing, whether success or failure.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from the IdP
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Opaque state value; must match the `oidc_state` cookie
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code returned directly by the IdP
          schema:
            type: string
            example: access_denied
      responses:
        '302':
          description: |
            | Redirect destination | Condition |
            |---|---|
            | `/{role-landing}` | Successful login |
            | `/login?error=sso_disabled` | OIDC not configured |
            | `/login?error=sso_failed` | IdP returned an error or token exchange failed |
            | `/login?error=sso_state` | Missing/mismatched state or verifier |
            | `/login?error=inactive` | User account is inactive |
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Sets the `session` HttpOnly cookie on success
              schema:
                type: string

  # ── Exports ───────────────────────────────────────────────────────────────
  /api/exports/{type}:
    get:
      tags: [Exports]
      operationId: exportCsv
      summary: Download a CSV export
      description: |
        Returns a CSV file download. The `type` path parameter selects which
        export to run. Role requirements vary per type.

        | `type` | Required role permission | Description |
        |---|---|---|
        | `orders` | `finance:export` | All paid/awaiting orders for a cycle |
        | `payments` | `finance:export` | HitPay payment ledger |
        | `subsidy` | `finance:export` | Weekly subsidy cost summary |
        | `reconciliation` | `finance:export` | Full order + payment reconciliation |
        | `kitchen` | `kitchen:view` | Dish portion counts per delivery site |
        | `kitchen-employees` | `kitchen:view` | Per-employee dish breakdown for a cycle |
        | `audit` | `settings:manage` | Audit log export |
        | `my-orders` | *(any signed-in user)* | Signed-in user's own order history |
        | `restaurants` | `catalogue:manage` | Restaurant catalogue |
        | `dishes` | `catalogue:manage` | Dish catalogue |
        | `weekly-menu-template` | `menu:plan` | CSV template for weekly menu import |

        **Personal data notice:** `orders`, `payments`, `kitchen`, `kitchen-employees`,
        and `reconciliation` contain employee names and staff IDs. Store on
        approved systems only; do not forward outside Finance/HR.
      security:
        - sessionCookie: []
      parameters:
        - name: type
          in: path
          required: true
          description: Export type (see table above)
          schema:
            type: string
            enum:
              - orders
              - payments
              - subsidy
              - reconciliation
              - kitchen
              - kitchen-employees
              - audit
              - my-orders
              - restaurants
              - dishes
              - weekly-menu-template
        - name: cycle
          in: query
          required: false
          description: |
            Menu cycle ID (CUID). Required for: `orders`, `kitchen`, `kitchen-employees`.
            Optional for: `payments`, `reconciliation` (defaults to trailing weeks when omitted).
          schema:
            type: string
            example: clxxxxxxxxxxxxxxxxxxxxxxxx
        - name: weeks
          in: query
          required: false
          description: |
            Trailing week window (integer, 1–52, default 12). Used by `subsidy` and
            `reconciliation` (when no `cycle` is provided).
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 12
        - name: month
          in: query
          required: false
          description: |
            Month in `YYYY-MM` format. Required for `my-orders`.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-09'
        - name: from
          in: query
          required: false
          description: |
            Start date `YYYY-MM-DD` for the `audit` export (default: 90 days ago).
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: to
          in: query
          required: false
          description: |
            End date `YYYY-MM-DD` for the `audit` export (default: today).
          schema:
            type: string
            format: date
            example: '2026-09-30'
        - name: category
          in: query
          required: false
          description: |
            Audit log category filter. One of: `Orders`, `Payments`, `Exports`,
            `Cycles`, `Delivery`, `Users`, `Settings`.
          schema:
            type: string
            enum: [Orders, Payments, Exports, Cycles, Delivery, Users, Settings]
        - name: q
          in: query
          required: false
          description: Full-text search against actor name or staff ID (audit export only).
          schema:
            type: string
      responses:
        '200':
          description: CSV file download
          headers:
            Content-Disposition:
              description: Suggested filename for the download
              schema:
                type: string
                example: 'attachment; filename="orders-2026-09-30.csv"'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Missing required query parameter (e.g. `cycle` or `month`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingCycle:
                  value: { error: "Missing cycle" }
                invalidMonth:
                  value: { error: "Missing or invalid month (expected YYYY-MM)" }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown export type or cycle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownType:
                  value: { error: "Unknown export" }
                cycleNotFound:
                  value: { error: "Cycle not found" }

  # ── Orders: status polling ────────────────────────────────────────────────
  /api/orders/{reference}/status:
    get:
      tags: [Orders]
      operationId: getOrderStatus
      summary: Poll order payment status
      description: |
        Returns the current `status` of an order. Intended to be polled by the
        payment-waiting UI so it can detect when the HitPay webhook has updated
        the order, without the user needing to manually refresh.

        A user may only read their own order unless they have `finance:view`.

        The response always sets `Cache-Control: no-store`.
      security:
        - sessionCookie: []
      parameters:
        - name: reference
          in: path
          required: true
          description: |
            Human-readable order reference (e.g. `M-20260930-XXXXX`).
            URI-encoded automatically; pass the raw string.
          schema:
            type: string
            example: M-20260930-A1B2C
      responses:
        '200':
          description: Current order status
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/OrderStatus'
              example:
                status: PAID
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Order not found, or belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found

  # ── Webhooks: HitPay ──────────────────────────────────────────────────────
  /api/webhooks/hitpay:
    post:
      tags: [Webhooks]
      operationId: hitpayWebhook
      summary: Receive a HitPay payment notification
      description: |
        Called by HitPay when a payment succeeds or fails. This is the **only**
        path that may transition an order to `PAID` — the browser redirect is
        cosmetic and must not be trusted.

        **Security:** Every request is verified via HMAC-SHA256 using
        `HITPAY_SALT`. Requests with an invalid or missing `hmac` field are
        rejected with `400`.

        HitPay retries until it receives a `200`, so all processing is
        idempotent. An order that is already `PAID` is left unchanged.

        **Underpayment:** A `SUCCEEDED` webhook with an amount below the
        order's `netSen` is treated as `FAILED` and the payment record is
        marked accordingly.

        The request body is `application/x-www-form-urlencoded`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hmac]
              properties:
                payment_request_id:
                  type: string
                  description: HitPay payment request ID (matches `Payment.requestId`)
                  example: hp_req_xxxxxxxxxxxxxxxx
                payment_id:
                  type: string
                  description: HitPay payment ID for a completed payment
                  example: hp_pay_xxxxxxxxxxxxxxxx
                reference_number:
                  type: string
                  description: Order reference (fallback identifier when `payment_request_id` is absent)
                  example: M-20260930-A1B2C
                status:
                  type: string
                  description: Payment outcome from HitPay
                  enum: [completed, failed, pending]
                  example: completed
                amount:
                  type: string
                  description: Decimal amount in MYR (e.g. `"12.50"`)
                  example: "12.50"
                currency:
                  type: string
                  description: ISO 4217 currency code (usually `MYR`)
                  example: MYR
                payment_type:
                  type: string
                  description: |
                    Payment channel (e.g. `touch_n_go`, `duitnow`). When absent,
                    the server fetches it from the HitPay API using `payment_request_id`.
                  example: duitnow
                hmac:
                  type: string
                  description: HMAC-SHA256 signature for the payload, computed using `HITPAY_SALT`
                  example: a3f8c2...
      responses:
        '200':
          description: |
            Webhook acknowledged. Returned in all handled cases — including
            unmatched orders and idempotent re-deliveries — so HitPay stops
            retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: |
            Rejected without processing. Causes:
            - Malformed form-encoded body
            - Invalid HMAC signature
            - Missing both `payment_request_id` and `reference_number`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                malformedBody:
                  value: { error: "Malformed body" }
                invalidSignature:
                  value: { error: "Invalid signature" }
                missingIdentifiers:
                  value: { error: "Missing identifiers" }

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        HttpOnly session cookie set by the auth endpoints.
        Obtain via `/api/auth/joget-identify` or the OIDC flow.

  responses:
    Unauthenticated:
      description: Not signed in — no valid session cookie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not signed in

    Forbidden:
      description: Signed in but the role lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: Not signed in

    OrderStatus:
      type: string
      description: |
        Lifecycle state of an order:
        - `CART` – draft, not yet submitted
        - `AWAITING_PAYMENT` – submitted; waiting for HitPay webhook
        - `PAID` – payment confirmed by webhook
        - `CANCELLED` – cancelled by user or admin
        - `REFUNDED` – refund processed
      enum: [CART, AWAITING_PAYMENT, PAID, CANCELLED, REFUNDED]

    Role:
      type: string
      enum: [ADMIN, ANALYTICS, FINANCE, RECEPTION, USER]

    AuthProvider:
      type: string
      enum: [LOCAL, LDAP, OIDC, JOGET]
